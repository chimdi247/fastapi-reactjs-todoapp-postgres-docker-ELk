apiVersion: 1

datasources:
  # Metrics: Grafana Mimir speaks the Prometheus HTTP API under /prometheus.
  - name: Mimir
    uid: mimir
    type: prometheus
    access: proxy
    orgId: 1
    url: http://mimir:9009/prometheus
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Mimir
      manageAlerts: true

  # Logs (same store Kibana reads) - handy for log panels next to metrics.
  - name: Elasticsearch Logs
    uid: es-logs
    type: elasticsearch
    access: proxy
    orgId: 1
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: elastic
    editable: false
    secureJsonData:
      basicAuthPassword: $ELASTIC_PASSWORD
    jsonData:
      index: "logs-todo-*"
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: log.level
