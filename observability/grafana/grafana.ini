; Mounted at /etc/grafana/grafana.ini. $__env{NAME} values come from docker-compose.

[server]
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[analytics]
reporting_enabled = false
check_for_updates = false

[security]
admin_user = $__env{GRAFANA_ADMIN_USER}
admin_password = """$__env{GRAFANA_ADMIN_PASSWORD}"""
disable_gravatar = true

[users]
allow_sign_up = false
default_theme = dark

[auth.anonymous]
enabled = false

[metrics]
enabled = true

[dashboards]
default_home_dashboard_path = /etc/grafana/dashboards/todo-app-overview.json

[unified_alerting]
enabled = true
min_interval = 10s

[alerting]
enabled = false

; ---- SMTP: used by the Grafana-managed alert contact point -------------------
; Defaults point at the bundled Mailpit catch-all (UI: http://localhost:8025).
; Put real SMTP credentials in .env (SMTP_HOST, SMTP_PORT, SMTP_USER, ...) to send real mail.
[smtp]
enabled = true
host = $__env{SMTP_HOST}:$__env{SMTP_PORT}
user = $__env{SMTP_USER}
password = """$__env{SMTP_PASSWORD}"""
from_address = $__env{SMTP_FROM_ADDRESS}
from_name = Todo App Alerts
skip_verify = $__env{SMTP_SKIP_VERIFY}
; one of: OpportunisticStartTLS | MandatoryStartTLS | NoStartTLS
startTLS_policy = $__env{SMTP_STARTTLS_POLICY}

[log]
mode = console
level = info
