[pytest]
# importlib mode lets several dirs share file names (conftest.py, test_*.py)
addopts = -ra --import-mode=importlib --strict-markers
testpaths = unit/backend integration
markers =
    unit: pure unit tests (no running stack needed)
    integration: needs the docker compose stack (API on BASE_URL)
    security: authentication / authorization / hardening checks
    observability: verifies telemetry really lands in Mimir / Elasticsearch / Grafana
    selenium: browser tests driven by Selenium WebDriver
    smoke: fast post-deploy sanity checks
timeout = 60
