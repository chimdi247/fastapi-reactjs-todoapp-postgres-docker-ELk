# Mounted into the frontend container at /etc/nginx/conf.d/default.conf
# / -> React SPA
# /api/* -> FastAPI backend (prefix stripped)
# /otlp/* -> OpenTelemetry Collector
# /nginx_status -> internal Nginx metrics

resolver 127.0.0.11 valid=10s ipv6=off;

server { listen 80; server_name _;

root /usr/share/nginx/html;
index index.html;

server_tokens off;
gzip on;
gzip_types text/plain text/css application/json application/javascript image/svg+xml;
gzip_min_length 1024;

# Security headers
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Health check
location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
}

# Internal metrics
location = /nginx_status {
    stub_status;
    access_log off;
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
}

# API reverse proxy
location /api/ {
    set $backend_upstream http://backend:8085;

    # Strip /api before forwarding to FastAPI.
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $backend_upstream;

    proxy_http_version 1.1;

    # Preserve the original public host and port.
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $http_host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Forward W3C trace context.
    proxy_set_header traceparent $http_traceparent;
    proxy_set_header tracestate  $http_tracestate;

    # Rewrite FastAPI redirects back under /api/.
    proxy_redirect ~^https?://[^/]+(/.*)$ /api$1;
    proxy_redirect ~^(/.*)$ /api$1;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}

# Browser telemetry -> OpenTelemetry Collector
location /otlp/ {
    limit_except POST {
        deny all;
    }

    client_max_body_size 1m;
    access_log off;

    set $otel_upstream http://otel-collector:4318;

    # /otlp/v1/traces -> /v1/traces
    rewrite ^/otlp/(.*)$ /$1 break;
    proxy_pass $otel_upstream;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
}

# Static assets
location /assets/ {
    expires 1y;
    try_files $uri =404;
}

# React SPA
location / {
    expires -1;
    try_files $uri $uri/ /index.html;
}


}
