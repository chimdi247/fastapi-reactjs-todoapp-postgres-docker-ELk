# Mounted into the frontend container at /etc/nginx/conf.d/default.conf
#
#   /            -> static React SPA (history-API fallback to index.html)
#   /api/*       -> FastAPI backend         (prefix stripped)
#   /otlp/*      -> OpenTelemetry Collector (browser traces, OTLP/HTTP)
#   /nginx_status-> stub_status, scraped by the collector (internal only)
#
# Docker's embedded DNS (127.0.0.11) + variables in proxy_pass make nginx resolve
# upstreams at request time, so it still boots if a backend is briefly down.

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # --- security headers --------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- health & metrics --------------------------------------------------
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /nginx_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny  all;
    }

    # --- API reverse proxy ---------------------------------------------------
    location /api/ {
        set $backend_upstream http://backend:8085;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # traceparent / tracestate are forwarded untouched (default behaviour),
        # which is what links browser spans to backend spans.
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # --- Browser telemetry -> collector -------------------------------------
    location /otlp/ {
        limit_except POST { deny all; }
        client_max_body_size 1m;
        access_log off;

        set $otel_upstream http://otel-collector:4318;
        rewrite ^/otlp/(.*)$ /$1 break;
        proxy_pass $otel_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # --- static assets -------------------------------------------------------
    location /assets/ {
        # NB: add_header inside a location would discard the server-level security
        # headers (nginx does not merge them), hence `expires` here.
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;   # => Cache-Control: no-cache (index.html must always revalidate)
        try_files $uri $uri/ /index.html;
    }
}
